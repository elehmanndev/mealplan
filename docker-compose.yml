services:
  mealplan:
    build: .
    image: mealplan:latest
    container_name: mealplan
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      # Override DATA_DIR in a host-local .env (gitignored) when running on
      # bare metal — e.g. an Unraid appdata path. Defaults to ./data so a
      # fresh checkout boots locally without env setup.
      - ${DATA_DIR:-./data}:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/mealplan.db
      - TZ=${TZ:-UTC}
      # OpenAI-compatible LLM gateway for /chat (9router on Unraid). Set in
      # /mnt/user/appdata/mealplan/.env; compose auto-reads it. Empty = chat 500.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}

services:
  mealplan:
    build: .
    image: mealplan:latest
    container_name: mealplan
    restart: unless-stopped
    ports:
      - "3004:3000"
    volumes:
      - /mnt/user/appdata/mealplan/data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/mealplan.db
      - TZ=Europe/Madrid

services:
  mealplan:
    build: .
    image: mealplan:latest
    container_name: mealplan
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      # Override DATA_DIR in a host-local .env (gitignored) when running on
      # bare metal — e.g. an Unraid appdata path. Defaults to ./data so a
      # fresh checkout boots locally without env setup.
      - ${DATA_DIR:-./data}:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/mealplan.db
      - TZ=${TZ:-UTC}
      # Gemini API key for /chat. Set in /mnt/user/appdata/mealplan/.env on Unraid.
      # docker compose auto-reads .env from the project dir; this line passes the
      # value through to the container. Empty = chat route returns 500.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
